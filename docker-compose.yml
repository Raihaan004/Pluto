services:
  pluto_db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plutopass}
      POSTGRES_DB: ${POSTGRES_DB:-plutodb}
    ports:
      - "5432:5432"
    volumes:
      - pluto_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-plutopass}@pluto_db:5432/${POSTGRES_DB:-plutodb}
      - PLUTO_ADMIN_URL=http://host.docker.internal:3001
    env_file:
      - ./backend/.env
    depends_on:
      - pluto_db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    restart: always

volumes:
  pluto_data:
