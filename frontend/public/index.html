<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pluto Workspace Loader</title>
    <script>
        // Redirect to your local Next.js dev server with Jira parameters
        const urlParams = new URLSearchParams(window.location.search);
        // Ensure the path matches your frontend Jira route
        window.location.href = "http://localhost:3000/jira?" + urlParams.toString();
    </script>
</head>
<body style="background: #f4f5f7; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;">
    <div style="text-align: center;">
        <p>Connecting to Pluto Local Server...</p>
        <p style="font-size: 12px; color: #666;">Make sure 'npm run dev' is running on port 3000</p>
    </div>
</body>
</html>
